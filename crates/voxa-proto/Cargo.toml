[package]
name = "voxa-proto"
description = "Shared wire protocol, models and cryptography for Voxa"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
bincode = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
sha2 = "0.10"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "default-resolver-crypto", "std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util"] }
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

[features]
update = ["dep:ureq", "dep:serde_json"]

[[example]]
name = "update_check"
required-features = ["update"]

